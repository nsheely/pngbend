[package]
name = "pngbend"
version = "0.1.0"
edition = "2024"
description = "Interactive bit-level PNG editor: inspect and edit the DEFLATE literals and LZ77 back-references that produced each pixel, then save the patched stream as a valid PNG."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nsheely/pngbend"
keywords = ["png", "deflate", "databending", "lz77", "egui"]
categories = ["graphics", "multimedia::images", "compression"]

[lib]
name = "pngbend"
path = "src/lib.rs"

[[bin]]
name = "pngbend"
path = "src/main.rs"

[dependencies]
eframe  = "0.34"
egui    = "0.34"
rayon   = "1"
rfd     = "0.17"
wide    = "0.7"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest  = "1"

[[bench]]
name = "perf"
harness = false

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
panic = "unwind"
