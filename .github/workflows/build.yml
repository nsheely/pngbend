name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least-privilege GITHUB_TOKEN for every job: this workflow only reads the
# repo (checkout, build, test, lint, cargo-deny) and uploads build artifacts,
# none of which need write access.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies (egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Supply-chain audit (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # Verify glasspng's declared MSRV is executable truth. Only the codec has a
  # low, independently-meaningful floor (1.88, zero runtime deps); the editor
  # inherits 1.92 from the egui stack, which cargo enforces and the stable
  # build job already exercises.
  msrv:
    name: MSRV (glasspng 1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.100

      - name: Build and test glasspng on its MSRV
        run: cargo test -p glasspng

  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pngbend-linux-x86_64
            binary: pngbend
          - os: macos-14 # macOS 14 uses ARM64 (Apple Silicon)
            target: aarch64-apple-darwin
            artifact_name: pngbend-macos-arm64
            binary: pngbend
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pngbend-windows-x86_64
            binary: pngbend.exe
    runs-on: ${{ matrix.os }}
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all targets (debug)
        run: cargo build --workspace --all-targets --verbose

      # The differential conformance corpus isn't vendored; fetch it (from a
      # pinned GitHub mirror) so the pngsuite test runs instead of skipping.
      # Linux only: the test is platform-independent and skips cleanly on the
      # other runners, where the corpus is absent.
      - name: Fetch PngSuite corpus
        if: runner.os == 'Linux'
        run: bash scripts/fetch-pngsuite.sh

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Compile benchmarks
        run: cargo bench --workspace --no-run --verbose

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/${{ matrix.binary }}
          retention-days: 30
